name: Baan
description: 'Baan (Baan Company N.V., originally The Baan Corporation) was a Dutch enterprise resource
  planning software vendor founded in 1978 in Barneveld, Netherlands by Jan Baan and later joined by his
  brother Paul Baan. Baan built one of the first genuinely component-based ERP suites, known for its
  Dynamic Enterprise Modeler (DEM), its Baan Tools 4GL development environment, and deep manufacturing
  and project-industry functionality. At its late-1990s peak Baan served roughly 3,000 customers and
  posted close to $700 million in revenue, making it one of the leading global ERP providers alongside
  SAP, Oracle and PeopleSoft. Following accounting controversy and a collapse in its share price, Baan
  was acquired by the British engineering group Invensys in 2000, sold on to SSA Global Technologies in
  2003, and absorbed into Infor Global Solutions when Infor acquired SSA in 2006. Baan no longer exists
  as an operating company or an independent brand: the product line lives on as Infor LN, and the
  baan.com and baan.nl domains now permanently redirect to the Infor LN product page. Consequently this
  profile carries no first-party API surface of its own — any modern programmatic access to the Baan
  lineage is delivered through Infor LN REST APIs and the Infor ION API gateway on Infor''s developer
  platform. Baan Company is listed by Battery Ventures as an exited investment.'
